<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Login</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 28px;
            border-radius: 8px;
            border: 1px solid #2e2e2e;
            width: 310px;
        }
        h2 {
            margin: 0 0 16px 0;
            font-size: 19px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #383838;
            background: #141414;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #1d4ed8;
        }
        .extra-field {
            display: none;
        }
        #msg {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign In</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <input type="text" id="website_url" name="website_url" class="extra-field" tabindex="-1" autocomplete="off">
            <input type="hidden" id="csrfToken" value="{{ csrf_token }}">
            <button type="submit">Log In</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        const form = document.getElementById("login-form");
        const msg = document.getElementById("msg");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const website_url = document.getElementById("website_url").value;
            const tokEl = document.getElementById("csrfToken");

            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, website_url, token: tokEl.value })
            });

            const data = await res.json();
            msg.textContent = data.message;
            msg.style.color = res.ok ? "#4ade80" : "#f87171";

            if (res.status === 401) {
                const tokRes = await fetch("/token");
                if (tokRes.ok) {
                    const tokData = await tokRes.json();
                    tokEl.value = tokData.token;
                }
            }
        });
    </script>
</body>
</html>
